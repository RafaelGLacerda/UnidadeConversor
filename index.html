<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="logo.png" type="image/png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Conversor de Unidades</title>
    
    <style>
        :root {
            /* Variáveis padrão (Light Mode) */
            --background-color: #f4f4f9;
            --text-color: #333;
            --card-background: #ffffff;
            --primary-color: #007bff; /* Azul vibrante */
            --secondary-color: #6c757d; /* Cinza suave */
            --border-color: #ddd;
            --shadow-color: rgba(0, 0, 0, 0.1);
        }

        /* Dark Mode */
        body.dark-mode {
            --background-color: #121212;
            --text-color: #e0e0e0;
            --card-background: #1e1e1e;
            --primary-color: #8ab4f8; /* Azul mais claro para dark mode */
            --secondary-color: #9aa0a6;
            --border-color: #333;
            --shadow-color: rgba(0, 255, 255, 0.05);
        }
        
        /* Reset e Base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s, color 0.3s;
            background-color: var(--background-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Container Principal */
        .container {
            width: 90%;
            max-width: 800px;
            background-color: var(--card-background);
            border-radius: 15px;
            box-shadow: 0 10px 30px var(--shadow-color);
            padding: 30px;
        }

        /* Título e Botão de Tema */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        h1 {
            color: var(--primary-color);
            font-size: 2em;
        }
        
        #theme-toggle {
            background: none;
            border: 2px solid var(--secondary-color);
            color: var(--secondary-color);
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }
        
        #theme-toggle:hover {
            background-color: var(--primary-color);
            color: var(--card-background);
            border-color: var(--primary-color);
        }

        /* Controles de Conversão */
        .conversion-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 8px;
            font-weight: 600;
        }

        select, input[type="number"] {
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1em;
            background-color: var(--background-color);
            color: var(--text-color);
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        
        select:focus, input[type="number"]:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 5px var(--primary-color);
            outline: none;
        }
        
        /* Estilo dos selects no dark mode */
        body.dark-mode select {
             /* Cor da seta do select (customizado para dark mode) */
             filter: invert(1);
        }

        /* Resultado */
        .result-area {
            margin-top: 30px;
            text-align: center;
            padding: 20px;
            background-color: var(--background-color);
            border-radius: 10px;
            border: 1px dashed var(--primary-color);
        }
        
        #result-label {
            font-size: 1.1em;
            color: var(--secondary-color);
            display: block;
            margin-bottom: 10px;
        }

        #result {
            font-size: 2.5em;
            font-weight: bold;
            color: var(--primary-color);
            word-wrap: break-word; 
        }
        
        #conversion-type {
            margin-bottom: 20px;
        }

        /* Responsividade */
        @media (max-width: 600px) {
            .conversion-area {
                grid-template-columns: 1fr;
            }
            h1 {
                font-size: 1.5em;
            }
            #theme-toggle {
                padding: 6px 12px;
            }
            #result {
                font-size: 2em;
            }
            /* Ocupa toda a largura em telas pequenas */
            .control-group[style="grid-column: 1 / 3;"] {
                grid-column: 1 / 2 !important; 
            }
        }
    </style>
</head>
<body class="">
    <div class="container">
        <header>
            <h1>📏 Super Conversor</h1>
            <button id="theme-toggle">🌙 Modo Escuro</button>
        </header>

        <div class="control-group">
            <label for="conversion-type">Tipo de Conversão:</label>
            <select id="conversion-type"></select>
        </div>

        <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 20px 0;">

        <div class="conversion-area">
            
            <div class="control-group">
                <label for="input-value">Valor para Converter:</label>
                <input type="number" id="input-value" value="1" min="0">
            </div>

            <div class="control-group">
                <label for="unit-from">Converter De:</label>
                <select id="unit-from"></select>
            </div>

            <div class="control-group" style="grid-column: 1 / 3;">
                <label for="unit-to">Para:</label>
                <select id="unit-to"></select>
            </div>
        </div>

        <div class="result-area">
            <span id="result-label">Resultado:</span>
            <div id="result">0.00</div>
        </div>
    </div>

    <script>
        // --- 1. Definição das Conversões ---
        const CONVERSIONS = {
            // CATEGORIA: {unidade: {para_base: fator_ou_funcao, da_base: fator_ou_funcao, nome: 'Nome Completo'}}
            
            // 1. COMPRIMENTO
            comprimento: {
                base_unit: 'm', // A unidade base para todos os cálculos internos é o metro
                m: { para_base: 1, nome: 'Metro (m)' }, 
                km: { para_base: 1000, nome: 'Quilômetro (km)' }, 
                cm: { da_base: 0.01, nome: 'Centímetro (cm)' }, 
                mm: { da_base: 0.001, nome: 'Milímetro (mm)' },
                milha: { para_base: 1609.34, nome: 'Milha' },
                pe: { da_base: 0.3048, nome: 'Pé (ft)' },
                polegada: { da_base: 0.0254, nome: 'Polegada (in)' },
            },
            
            // 2. TEMPERATURA (Requer funções complexas)
            temperatura: {
                base_unit: 'C',
                C: { para_base: (v) => v, nome: 'Celsius (°C)' },
                F: { 
                    para_base: (v) => (v - 32) * (5 / 9), // F para C
                    da_base: (v) => (v * (9 / 5)) + 32,  // C para F
                    nome: 'Fahrenheit (°F)' 
                },
                K: { 
                    para_base: (v) => v - 273.15, // K para C
                    da_base: (v) => v + 273.15,  // C para K
                    nome: 'Kelvin (K)' 
                },
            },

            // 3. PESO / MASSA
            peso: {
                base_unit: 'kg',
                kg: { para_base: 1, nome: 'Quilograma (kg)' },
                g: { da_base: 0.001, nome: 'Grama (g)' },
                mg: { da_base: 0.000001, nome: 'Miligrama (mg)' },
                lb: { para_base: 0.453592, nome: 'Libra (lb)' },
                ton: { para_base: 1000, nome: 'Tonelada (t)' },
            },

            // 4. VOLUME
            volume: {
                base_unit: 'L',
                L: { para_base: 1, nome: 'Litro (L)' },
                mL: { da_base: 0.001, nome: 'Mililitro (mL)' },
                m3: { para_base: 1000, nome: 'Metro Cúbico (m³)' },
                gal: { para_base: 3.78541, nome: 'Galão Americano (gal)' },
            },

            // 5. VELOCIDADE
            velocidade: {
                base_unit: 'm/s',
                'm/s': { para_base: 1, nome: 'Metro por Segundo (m/s)' },
                'km/h': { para_base: 1 / 3.6, nome: 'Quilômetro por Hora (km/h)' }, 
                'mph': { para_base: 0.44704, nome: 'Milha por Hora (mph)' }, 
            },
            
            // 6. DADOS DIGITAIS (Base 1024)
            dados: {
                base_unit: 'byte',
                byte: { para_base: 1, nome: 'Byte (B)' },
                KB: { para_base: 1024, nome: 'Kilobyte (KB)' },
                MB: { para_base: 1024 * 1024, nome: 'Megabyte (MB)' },
                GB: { para_base: 1024 * 1024 * 1024, nome: 'Gigabyte (GB)' },
                TB: { para_base: 1024 * 1024 * 1024 * 1024, nome: 'Terabyte (TB)' },
            },
            
            // 7. TEMPO
            tempo: {
                base_unit: 's',
                s: { para_base: 1, nome: 'Segundo (s)' },
                min: { para_base: 60, nome: 'Minuto (min)' },
                h: { para_base: 3600, nome: 'Hora (h)' },
                dia: { para_base: 86400, nome: 'Dia' },
            }
        };

        // --- 2. Elementos do DOM ---
        const $typeSelect = document.getElementById('conversion-type');
        const $unitFromSelect = document.getElementById('unit-from');
        const $unitToSelect = document.getElementById('unit-to');
        const $inputValue = document.getElementById('input-value');
        const $resultDiv = document.getElementById('result');
        const $themeToggle = document.getElementById('theme-toggle');
        const $body = document.body;

        // --- 3. Funções de Popular Seletor ---

        function populateConversionTypes() {
            for (const key in CONVERSIONS) {
                const option = document.createElement('option');
                option.value = key;
                // Capitaliza a primeira letra para exibir
                option.textContent = key.charAt(0).toUpperCase() + key.slice(1);
                $typeSelect.appendChild(option);
            }
            // Força o carregamento das unidades para o primeiro tipo
            $typeSelect.dispatchEvent(new Event('change'));
        }

        function populateUnits(type) {
            const units = CONVERSIONS[type];
            $unitFromSelect.innerHTML = '';
            $unitToSelect.innerHTML = '';

            for (const key in units) {
                if (key === 'base_unit') continue;
                
                const optionFrom = document.createElement('option');
                optionFrom.value = key;
                optionFrom.textContent = units[key].nome;

                const optionTo = optionFrom.cloneNode(true);

                $unitFromSelect.appendChild(optionFrom);
                $unitToSelect.appendChild(optionTo);
            }

            // Define a unidade base no 'De' e a primeira outra unidade no 'Para'
            $unitFromSelect.value = units.base_unit;
            if($unitToSelect.options.length > 1) {
                // Tenta selecionar o segundo elemento para evitar "De km para km"
                $unitToSelect.value = $unitToSelect.options[1].value;
            }
            convert();
        }


        // --- 4. Lógica de Conversão Principal ---

        function convert() {
            const type = $typeSelect.value;
            const unitFrom = $unitFromSelect.value;
            const unitTo = $unitToSelect.value;
            let value = parseFloat($inputValue.value);

            if (isNaN(value) || value < 0) {
                $resultDiv.textContent = 'Valor Inválido';
                return;
            }
            
            if (unitFrom === unitTo) {
                $resultDiv.textContent = value.toFixed(4); // 4 casas para consistência
                return;
            }

            const unitsConfig = CONVERSIONS[type];
            const fromConfig = unitsConfig[unitFrom];
            const toConfig = unitsConfig[unitTo];
            const baseUnit = unitsConfig.base_unit;

            let valueInBase;

            // 1. Converter DE (from) para a Unidade Base
            if (unitFrom === baseUnit) {
                valueInBase = value;
            } else if (fromConfig.para_base) {
                valueInBase = typeof fromConfig.para_base === 'function' ? 
                                fromConfig.para_base(value) : 
                                value * fromConfig.para_base;
            } else {
                valueInBase = value / fromConfig.da_base;
            }
            
            let finalResult;
            
            // 2. Converter da Unidade Base (valueInBase) PARA (to) a Unidade Final
            if (unitTo === baseUnit) {
                finalResult = valueInBase;
            } else if (toConfig.da_base) {
                finalResult = typeof toConfig.da_base === 'function' ? 
                                toConfig.da_base(valueInBase) : 
                                valueInBase / toConfig.da_base;
            } else {
                finalResult = valueInBase / toConfig.para_base;
            }

            // Exibir Resultado (Notação científica para números muito grandes/pequenos)
            if (Math.abs(finalResult) > 1000000 || (Math.abs(finalResult) > 0 && Math.abs(finalResult) < 0.0001)) {
                $resultDiv.textContent = finalResult.toExponential(4);
            } else {
                $resultDiv.textContent = finalResult.toFixed(4);
            }
        }


        // --- 5. Lógica Dark/Light Mode ---

        function toggleTheme() {
            const isDarkMode = $body.classList.toggle('dark-mode');
            localStorage.setItem('theme', isDarkMode ? 'dark' : 'light');
            $themeToggle.textContent = isDarkMode ? '☀️ Modo Claro' : '🌙 Modo Escuro';
        }

        function loadTheme() {
            const savedTheme = localStorage.getItem('theme') || 
                               (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            if (savedTheme === 'dark') {
                $body.classList.add('dark-mode');
                $themeToggle.textContent = '☀️ Modo Claro';
            } else {
                $body.classList.remove('dark-mode');
                $themeToggle.textContent = '🌙 Modo Escuro';
            }
        }


        // --- 6. Event Listeners e Inicialização ---

        document.addEventListener('DOMContentLoaded', () => {
            loadTheme();
            populateConversionTypes();

            // Eventos que disparam o cálculo
            $inputValue.addEventListener('input', convert);
            $unitFromSelect.addEventListener('change', convert);
            $unitToSelect.addEventListener('change', convert);
            
            // Evento que atualiza as unidades
            $typeSelect.addEventListener('change', (e) => {
                populateUnits(e.target.value);
            });

            // Evento para alternar o tema
            $themeToggle.addEventListener('click', toggleTheme);
        });
    </script>
</body>
</html>
